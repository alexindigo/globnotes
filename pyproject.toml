[project]
name = "globnotes"
version = "0.1.0"
description = "A database-less note taking web app where a note's title is its path — built for Obsidian vaults and nested markdown trees."
license = "LGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "whoosh==2.7.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "aiofiles==25.1.0",
    "python-jose[cryptography]==3.5.0",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "httpx",
    "pytest",
    "rope",
    "isort",
]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["server", "tests"]
