name: Docker

on:
  push:
    tags: ["v*"]

# Publish releases one at a time so the latest decision and the push happen in order.
# Pending releases queue instead of replacing each other.
concurrency:
  group: docker-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require the tag to match VERSION
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Decide whether to publish latest
        id: latest
        run: scripts/docker-latest-tag.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/alexindigo/globnotes
            alexindigo/globnotes
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{major}}
            type=match,pattern=^v(.*)$,group=1
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GLOBNOTES_REVISION=${{ github.sha }}
