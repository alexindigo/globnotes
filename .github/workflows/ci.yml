name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: "Install dependencies"
        run: deno install
      - name: "Server: lint"
        run: deno lint server/ tests/
      - name: "Server: type check"
        run: deno check server/main.ts tests/**/*.ts
      - name: "Server: tests"
        run: >-
          deno test --unstable-worker-options
          --allow-read --allow-write --allow-env --allow-run --allow-net
          tests/
      - name: "Client: unit tests"
        run: deno task test:client
      - name: "Client: build"
        run: deno task build:client

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
