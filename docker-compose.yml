services:
  globnotes:
    image: ghcr.io/alexindigo/globnotes:latest
    container_name: globnotes
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./notes:/data
      # Isolated vaults (own index/plugins/brand/auth) — not subfolders of one tree:
      # - /srv/dad-notes:/vaults/dad
      # - /srv/mom-notes:/vaults/mom
    environment:
      # GLOBNOTES_VAULTS: "dad:/vaults/dad,mom:/vaults/mom"
      # GLOBNOTES_AUTH_TYPE_dad: "none"
      # GLOBNOTES_AUTH_TYPE_mom: "none"
      # Optional. Leave unset for the first-run setup wizard, or choose
      # explicitly:
      # GLOBNOTES_AUTH_TYPE: "none"  # trusted home network only!
      # GLOBNOTES_AUTH_TYPE: "password"
      # GLOBNOTES_USERNAME: "admin"
      # GLOBNOTES_PASSWORD: "change-me"
      # GLOBNOTES_SECRET_KEY: "change-me-to-a-long-random-string"
      TZ: "UTC"
