services:
  globnotes:
    build: .
    image: globnotes:v3-dev
    container_name: globnotes
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Create the notes directory explicitly before starting.
      - ./notes:/data/globnotes
      # Optional instance overlay, separate from the shipped defaults:
      # - ./globnotes.toml:/app/config/globnotes.toml:ro
      # Optional metadata relocation:
      # - ./metadata:/metadata
    environment:
      # GLOBNOTES__METADATA_PATH: "/metadata"
      # GLOBNOTES__SERVER_ALLOWEDHOSTS: "globnotes.home"
      TZ: "UTC"
