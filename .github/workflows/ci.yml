name: CI

on:
  push:
    branches: [main, v2]
    tags: ["v2.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GLOBNOTES_CONTAINER_ENGINE: podman
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check successful PR test evidence
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! timeout 180s bash scripts/ci-pr-proof.sh; then
            printf 'run-tests=true\n' >> "$GITHUB_OUTPUT"
            printf 'Running tests: PR evidence lookup failed or exceeded its bound.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare harness control diff
        if: steps.proof.outputs.run-tests != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/globnotes/all/logs"
          changes="$RUNNER_TEMP/globnotes/all/logs/ci-changes.z"
          # Missing history, a new ref or a failed diff leaves no selection input:
          # select-checks.ts then runs every control (also always for v2 tags).
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              git diff --name-status -M -z "$BASE_SHA...$HEAD_SHA" > "$changes" || rm -f "$changes"
            else
              git diff --name-status -M -z "$BASE_SHA" "$HEAD_SHA" > "$changes" || rm -f "$changes"
            fi
          fi
      # Everything runs in the devcontainer (docs/testing.md), as the commit check does.
      - name: "All gates, with the browser suite"
        if: steps.proof.outputs.run-tests != 'false'
        run: >-
          .devcontainer/run.sh --browser
          --run-dir "$RUNNER_TEMP/globnotes/all"
          -- bash scripts/gates.sh --all --browser
          --ci-changes /run-logs/ci-changes.z --ci-ref "$GITHUB_REF"
      - name: "Timing tests, serially"
        if: steps.proof.outputs.run-tests != 'false'
        run: >-
          .devcontainer/run.sh
          --run-dir "$RUNNER_TEMP/globnotes/timing"
          -- bash scripts/gates.sh --timing
      - name: "Upload failure diagnostics"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-diagnostics
          path: |
            ${{ runner.temp }}/globnotes/*/logs/
            ${{ runner.temp }}/globnotes/*/artifacts/**/*.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
