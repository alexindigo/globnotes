name: CI

on:
  push:
    branches: [main, v2]
    tags: ["v2.*"]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GLOBNOTES_CONTAINER_ENGINE: podman
    outputs:
      run-tests: ${{ steps.proof.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check successful PR test evidence
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! timeout 180s bash scripts/ci-pr-proof.sh; then
            printf 'run-tests=true\n' >> "$GITHUB_OUTPUT"
            printf 'Running tests: PR evidence lookup failed or exceeded its bound.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    needs: evidence
    if: needs.evidence.outputs.run-tests != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GLOBNOTES_CONTAINER_ENGINE: podman
    steps:
      - uses: actions/checkout@v7
      # Everything runs in the devcontainer (docs/testing.md), as the commit check does.
      - name: "Non-native gates"
        run: >-
          .devcontainer/run.sh
          --run-dir "$RUNNER_TEMP/globnotes/all"
          -- bash scripts/gates.sh --checks
      - name: "Timing tests, serially"
        run: >-
          .devcontainer/run.sh
          --run-dir "$RUNNER_TEMP/globnotes/timing"
          -- bash scripts/gates.sh --timing
      - name: "Upload failure diagnostics"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checks-failure-diagnostics
          path: |
            ${{ runner.temp }}/globnotes/*/logs/
            ${{ runner.temp }}/globnotes/*/artifacts/**/*.json
            ${{ runner.temp }}/globnotes/*/artifacts/**/failure.png

  native:
    needs: evidence
    if: needs.evidence.outputs.run-tests != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      GLOBNOTES_CONTAINER_ENGINE: podman
    steps:
      - uses: actions/checkout@v7
      - name: Native shard
        run: >-
          .devcontainer/run.sh --browser
          --run-dir "$RUNNER_TEMP/globnotes/native"
          -- env GLOBNOTES_E2E_CONCURRENCY=2 bash scripts/gates.sh --native
          --shard '${{ matrix.shard }}'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ strategy.job-index }}-failure-diagnostics
          path: |
            ${{ runner.temp }}/globnotes/*/logs/
            ${{ runner.temp }}/globnotes/*/artifacts/**/*.json
            ${{ runner.temp }}/globnotes/*/artifacts/**/failure.png

  # Preserve the required check and the exact-SHA PR-proof job name. A skipped
  # shard is acceptable only when the evidence job explicitly reuses proof.
  test:
    needs: [evidence, checks, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require complete test evidence
        env:
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          RUN_TESTS: ${{ needs.evidence.outputs.run-tests }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$EVIDENCE_RESULT" = success
          if test "$RUN_TESTS" = false; then
            test "$CHECKS_RESULT" = skipped
            test "$NATIVE_RESULT" = skipped
          else
            test "$CHECKS_RESULT" = success
            test "$NATIVE_RESULT" = success
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
